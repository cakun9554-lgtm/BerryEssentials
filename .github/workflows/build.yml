name: Build BerryEssentials

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B -f pom.xml clean package

      - uses: actions/upload-artifact@v4
        with:
          name: BerryEssentials-JAR
          path: target/*.jar
